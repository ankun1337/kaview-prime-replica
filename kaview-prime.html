<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>kaView Prime 損益一覧</title>
<style>
  :root{
    --bg:#010101;
    --card:#171717;
    --teal-a:#2ca787;
    --teal:#2acfa4;
    --green:#12cf9e;
    --red:#db5051;
    --amt:#db5051;
    --hold:#f0a640;
    --bar-red:#d87285;
    --bar-lime:#c2ce50;
    --bar-pink:#e892ae;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    background:#000;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    color:#fff;
  }

  .screen{
    position:relative;
    width:388px; height:791px;
    overflow:hidden;
    background:var(--bg);
    display:flex; flex-direction:column;
    flex:0 0 auto;
  }

  /* ===== header (gold glow zone) ===== */
  .header{
    position:relative;
    flex:0 0 auto;
    background:#010101;
  }
  .header::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 80% 136% at 0% 0%,
        rgb(101,72,7) 0%, rgb(52,35,5) 34%, rgb(32,21,3) 54%,
        rgb(14,10,1) 75%, rgb(5,4,0) 95%, rgb(2,1,0) 100%);
    pointer-events:none;
  }
  .header>*{position:relative; z-index:1;}

  /* ===== top nav ===== */
  .navbar{
    height:40px; margin-top:5px; padding:0 11px 0 5.5px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center;}
  .brandimg{width:140.4px; height:28.7px; display:block;}
  .nav-actions{display:flex; align-items:center; gap:16px; color:#e9e9e9;}
  .nav-actions img{display:block; cursor:pointer;}

  /* ===== main tabs : full-width dark band + solid active block ===== */
  .maintabs{
    margin-top:0;
    height:48px;
    background:#18150e;
    display:flex; align-items:stretch; justify-content:space-between;
  }
  .mtab{
    display:flex; align-items:center; justify-content:center;
    flex:1 1 0; min-width:0; padding:0 6px;
    font-size:15.5px; font-weight:400; color:#8a8a8a;
    cursor:pointer; white-space:nowrap;
  }
  .mtab.active{
    position:relative;
    flex:0 0 136px; width:136px; padding:0 4px; gap:21px;
    background:#292a2c; color:#fff;
    font-size:17px; font-weight:700; letter-spacing:.5px;
    border-radius:0;
  }
  .mtab.active::before{
    content:""; position:absolute; top:0; left:0; right:0;
    height:3px; background:var(--green);
  }
  .mtab.active::after{
    content:""; position:absolute; top:3px; left:50%; margin-left:-6.5px;
    width:13px; height:7px; background:var(--green);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
  }
  .mt-arrow{display:flex; align-items:center; color:#d0d0d0;}
  .mt-arrow img{display:block;}

  /* ===== sub tabs : dark rounded container ===== */
  .subtabs-wrap{padding:7px 15px 0;}
  .subtabs{
    display:flex; height:39px; padding:4px;
    background:transparent; border-radius:12px;
    border:1px solid #514e48;
  }
  .stab{
    flex:1; display:flex; align-items:center; justify-content:center;
    font-size:13.4px; font-weight:600; color:#7e7e7e;
    border-radius:9px; cursor:pointer;
  }
  .stab.active{background:var(--teal-a); color:#fff;}

  /* ===== filter row ===== */
  .filterrow{
    display:flex; align-items:center; gap:0;
    padding:14.5px 14.3px 8.5px 12.7px;
    position:relative; z-index:30;
  }
  .cat-pill{
    position:relative;
    display:flex; align-items:center; gap:0.7px;
    height:29.4px; padding:0 4.5px 0 2.7px;
    background:#fff; border-radius:14.7px;
    cursor:pointer; flex:0 0 auto;
  }
  .funnel-img{display:block; flex:0 0 auto;}
  .cat-label{font-size:11px; font-weight:600; color:#1a1a1a; white-space:nowrap; line-height:1; letter-spacing:1.6px; padding-left:1.6px;}
  .cat-menu{
    position:absolute; top:calc(100% + 8px); left:0;
    background:#1c1c1e; border:1px solid #333; border-radius:12px;
    padding:5px; min-width:132px; z-index:60;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    display:none;
  }
  .cat-menu.open{display:block;}
  .cat-opt{padding:9px 12px; border-radius:8px; font-size:14px; color:#ddd; cursor:pointer;}
  .cat-opt:hover{background:rgba(255,255,255,.06);}
  .cat-opt.sel{color:var(--teal); font-weight:700;}


  .daterange{display:flex; align-items:center; gap:12px; margin-left:auto;}
  .datewrap{position:relative; flex:0 0 auto;}
  .datebox{
    position:relative; z-index:1;
    width:96.6px; height:44.3px;
    background:#080504; border:1px solid #6e6a66; border-radius:9px;
  }
  .datebox.hi{border-color:#e3e2e0; background:#080504;}
  .datebox.lit{border-color:#e3e2e0;}
  .datebox.lit .dyear,.datebox.lit .dmonth{color:#d3d2d0;}
  .dline{
    position:absolute; left:0; right:0;
    display:flex; align-items:baseline; justify-content:center; gap:5px;
  }
  .dline.main{top:50%; transform:translateY(-50%);}
  .dline.ghost{
    position:absolute; left:0; right:0; z-index:0;
    display:block; text-align:center;
    color:#232323; font-weight:400; font-size:14px; letter-spacing:.5px;
  ; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
  .dline.ghost.above{top:-9px;}
  .dline.ghost.below{bottom:-9px;}
  .dyear{font-size:11.5px; color:#434240; outline:none; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .dmonth{font-size:15.3px; font-weight:500; letter-spacing:-.3px; color:#434240; outline:none; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .datebox.hi .dyear{color:#d3d2d0;}
  .datebox.hi .dmonth{color:#d3d2d0;}
  .ddash{color:#6a6a6a; font-size:12px; margin:0 -7px; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}

  /* ===== scroll area (pure black) ===== */
  .scroll{
    flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
    background:
      radial-gradient(ellipse 77% 60% at 100% 100%,
        rgb(86,63,11) 0%, rgb(61,45,2) 30%, rgb(41,29,4) 43%,
        rgb(23,16,0) 60%, rgb(13,8,2) 79%, rgb(1,1,1) 100%),
      var(--bg);
    padding-bottom:100px;
  }
  .scroll::-webkit-scrollbar{width:0;}

  .bignum{position:relative; padding:20.5px 22px 13.8px; text-align:center; background:#171617; border-top:1px solid #222120; border-bottom:1px solid #464646;}
  .bn-title{font-size:13.5px; line-height:1.2; color:#dcdcdc; margin-bottom:14px; outline:none;}
  .bn-row{display:flex; align-items:center; justify-content:center; position:relative;}
  .bn-value{display:flex; align-items:baseline; justify-content:center;}
  .bn-value .amt{font-size:44.5px; font-weight:300; color:var(--red); letter-spacing:2.2px; line-height:1; outline:none; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; font-stretch:condensed;}
  .bn-value .yen{font-size:22px; font-weight:300; color:var(--red); margin-left:0;}
  .bn-chev{position:absolute; right:23.5px; top:50%; transform:translateY(-50%);}

  /* ===== cards ===== */
  .cardlist{padding:8.6px 8.5px 6px; display:flex; flex-direction:column; gap:6.2px;}
  .card{
    position:relative;
    display:flex; align-items:flex-start;
    min-height:66.3px;
    background:var(--card);
    border:1px solid #464646;
    border-radius:10.5px;
  }
  .bar{position:absolute; left:2px; top:20px; width:2.8px; height:28px; border-radius:2px;}
  .bar-red{background:var(--bar-red);}
  .bar-lime{background:var(--bar-lime);}
  .bar-pink{background:var(--bar-pink);}

  .cbody{
    flex:1 1 auto; min-width:0;
    padding:16.8px 31.5px 2px 6.3px;
    display:flex; flex-direction:column; gap:3.4px;
  }
  .crow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cleft{display:flex; align-items:baseline; gap:6px; min-width:0;}
  .c-code{font-size:10.4px; line-height:1.15; color:#dcdcdc; font-weight:300; flex:0 0 auto; outline:none;}
  .c-name{font-size:15px; line-height:1.15; color:#fff; font-weight:300; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:none;}
  .c-label{display:block; font-size:9px; line-height:1.1; color:#9a9a9a; outline:none; margin-top:0;}
  .c-amount{position:absolute; right:31.5px; bottom:5px; font-size:17.5px; line-height:1.1; font-weight:300; color:var(--amt); white-space:nowrap; outline:none;}
  .c-yen2{font-size:12.6px;}

  .card.fund .c-code{font-size:9.5px; line-height:1.2; color:#bcbcbc; flex:0 0 auto;}
  .card.fund .c-name{font-size:13px; font-weight:400; line-height:1.2;}
  .card.fund .cleft{gap:6px; flex:1 1 auto; min-width:0; padding-right:34px;}
  .card.fund .c-amount{font-size:17.5px;}

  .hold{
    position:absolute; top:-1.6px; right:23.9px;
    width:37.5px; height:18.5px; z-index:2;
  }
  .c-chev{
    position:absolute; right:15px; top:50%; transform:translateY(-50%);
    width:9.9px; height:14.4px;
    background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAjCAYAAACOysqWAAACZUlEQVR4nN3W24tNYRgG8N+MCX/AZtA4NRcShSspKSIiV0qSCxThRrmRCHHleKGQU0huUCQkkdMfIDculLMYQ5IIM059epdWu1l77xVzwVO771t7rfU+7/u8h281dXZ26E0096p1/yPBWJzHNYz72wTDcBBzMQ27MKHO+0PLEDzF2dh/wVRcxuTcM21V7z/DkEYJEnZgCX7EvYG4iYVxvxsDYt8a6wuMaJQg4Rhm40Fcf8UJ7MUrvEZ77EUEj8sQJFzH0li/x28FzsT9jDyLSlmCFP6tSPbV+K8L83ADo3LPpogqZQmy8EVVbUX/X1dMjMjyur9RgiBLYsLIWLeERF+DaHBEMqnIcC2CFHKGR7EOwoEgeRj/DcftyFUpgp7QEesRrMSduG7CHmxulKAwWYEkzRUsCu/T+/2wCSd7krmaoDBZgZex3sMUXML7KOPUjBcxPhq1pkT5RNfCnDDaHONlFnbHBKhJkE90LYyLCfw98tEcTfi7+VrUR6VAujkxcUdF+Sbjq3AuJ2VdgkG5CspjNdaHlJ/QF8twtGyZduSqJ8MGbIt9kuYb5vdkvJEIMmQhp2ZbHvvk/d0wfl8BakWQ93pMHEbJ+Gd8xCnMDOOVgj5qa8p9F7XGkKvWfXQ0UXZ8vsNx7MRzddDSwwTNG58RB1Ai/xAJTVqvzXncp2r6FhJUYzEOhcfd0Z3rYh412vmFOdiOw+FA8vJJjIK88YZQTdAeZ++a8LgrDv0FuNDgQCyUKOm8D9NzxKejO9+UkaUogtQ0b6MEv8QYmF/WYDXyZZphfwy7jX9iuBbBv/t1XekNgp88G4yirGAejQAAAABJRU5ErkJggg==) center/contain no-repeat;
  }

  .card.dividend .c-name{font-size:15px; font-weight:400;}

  /* ===== floating bottom nav (cutout) ===== */
  .bottomnav{position:absolute; left:6.2px; top:690px; z-index:20;}

  [contenteditable]:focus{
    outline:1px dashed rgba(18,198,161,.85);
    outline-offset:2px; border-radius:3px;
  }

</style>
</head>

  }

  function setSubtab(key){
    document.querySelectorAll("#subtabs .stab").forEach(el=>{
      el.classList.toggle("active", el.dataset.st === key);
    });
    bnTitle.textContent = SUBTITLES[key] || bnTitle.textContent;
  }

  function render(key){
    const s = DATA[key];
    catLabel.textContent = s.cat;
    document.getElementById("dbLeft").classList.toggle("lit", key === "all");
    bnAmt.textContent = s.total;
    setSubtab(s.subtab);
    cardlist.innerHTML = s.items.map(cardHTML).join("");
    document.querySelectorAll("#catMenu .cat-opt").forEach(o=>{
      o.classList.toggle("sel", o.dataset.cat === key);
    });
  }

  const catPill = document.getElementById("catPill");
  const catMenu = document.getElementById("catMenu");
  catPill.addEventListener("click",(e)=>{
    if(e.target.closest(".cat-opt")) return;
    catMenu.classList.toggle("open");
    e.stopPropagation();
  });
  catMenu.addEventListener("click",(e)=>{
    const opt = e.target.closest(".cat-opt");
    if(!opt) return;
    render(opt.dataset.cat);
    catMenu.classList.remove("open");
    e.stopPropagation();
  });
  document.addEventListener("click",()=>catMenu.classList.remove("open"));

  document.getElementById("subtabs").addEventListener("click",(e)=>{
    const t = e.target.closest(".stab");
    if(t) setSubtab(t.dataset.st);
  });

  const AR_L = document.querySelectorAll("#maintabs .mt-arrow")[0].outerHTML;
  const AR_R = document.querySelectorAll("#maintabs .mt-arrow")[1].outerHTML;
  document.getElementById("maintabs").addEventListener("click",(e)=>{
    const t = e.target.closest(".mtab");
    if(!t) return;
    document.querySelectorAll("#maintabs .mtab").forEach(m=>{
      if(m===t){
        if(!m.classList.contains("active")){
          const txt = m.textContent.trim();
          m.classList.add("active");
          m.innerHTML = AR_L + `<span class="mt-txt">${txt}</span>` + AR_R;
        }
      }else if(m.classList.contains("active")){
        const txt = m.querySelector(".mt-txt").textContent;
        m.classList.remove("active");
        m.textContent = txt;
      }
    });
  });

  document.getElementById("bottomnav").addEventListener("click",(e)=>{
    const t = e.target.closest(".bn-item");
    if(!t) return;
    document.querySelectorAll("#bottomnav .bn-item").forEach(b=>b.classList.toggle("active", b===t));
  });

  document.addEventListener("keydown",(e)=>{
    if(e.target.isContentEditable && e.key === "Enter"){
      e.preventDefault();
      e.target.blur();
    }
  });

  render("jp");
</script>
</body>
</html>
